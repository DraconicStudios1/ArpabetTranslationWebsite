<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arpabet Translator</title>
</head>
<body>
	<h1>ARPABET TRANSLATOR</h1>
    <h2>Enter Text to Translate</h2>
    
    <!-- When submitted, this sends data to the Python script -->
    <form action="/process" method="POST">
        <label for="text_input">Your text:</label>
        <input type="text" id="text_input" name="text_input" required>
        <button type="submit">Translate To Arpabet and Download</button>
    </form>
    
</body>
</html>
